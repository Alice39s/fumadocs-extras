name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci
      - run: pnpm run e2e
