ignoreWorkspaceRootCheck: true
catalogMode: prefer

trustPolicy: no-downgrade

shellEmulator: true

allowBuilds:
  esbuild: true

catalogs:
  cli:
    '@arethetypeswrong/core': ^0.18.5
    bumpp: ^12.3.0
    knip: ^6.38.0
    publint: ^0.3.24
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vite-plus: 1.0.0
  fumadocs:
    '@fumadocs/base-ui': ^16.16.2
    fumadocs-core: ^16.16.2
    fumadocs-ui: ^16.16.2
    next: ^16.3.8
  prod:
    lucide-react: ^1.50.0
  react:
    react: ^19.3.0
    react-dom: ^19.3.0
  testing:
    '@tailwindcss/oxide': ^4.3.3
    '@tailwindcss/vite': ^4.3.3
    '@vitest/browser-playwright': 5.0.1
    tailwindcss: ^4.3.3
    playwright: ^1.63.0
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest-browser-react: ^2.3.0
  types:
    '@types/node': ^26.6.3
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0

overrides:
  vite@*: catalog:cli

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.16.2'
  - fumadocs-core@16.16.2
  - fumadocs-ui@16.16.2
